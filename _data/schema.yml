# Facts about the people and organizations around Evan, for search engines and AI tools.
# _plugins/structured_data.rb turns these, plus _data/cv.yml, _data/socials.yml and papers.bib, into the
# schema.org data in every page's <head>. Checked against the DEMR Lab, BU and ORCID sites in October 2026.

# Topics Evan works on (schema.org "knowsAbout").
knows_about:
  - Rehabilitation science
  - Cerebral palsy
  - Unilateral cerebral palsy
  - Sensorimotor development
  - Infant motor development
  - Bimanual coordination
  - Online motor control
  - Functional near-infrared spectroscopy (fNIRS)
  - Transcranial magnetic stimulation (TMS)
  - Behavioral video coding
  - Wearable motion sensors (IMUs)

