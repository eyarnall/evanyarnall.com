  experience:
    - position: Graduate Researcher, DEMR Lab
      organization: Boston University, Sargent College
      start_date: 2023
      end_date: present
      highlights:
        - Study sensorimotor integration in children with unilateral cerebral palsy, combining fNIRS and TMS to assess corticospinal connectivity and sensory cortical responses during reaching.
        - Analyze (R, MATLAB, Python) a longitudinal sensorimotor dataset following typically developing infants and infants at risk for cerebral palsy from 6 to 24 months (dissertation dataset).
        - Designed a moving-target reaching apparatus for testing online motor control, built with lead engineer Julia Zayas (BU College of Engineering).
        - Develop and maintain behavioral coding pipelines in Datavyu (Ruby, Python), including inter-rater reliability workflows.
    - position: Research Technician, Laboratory for Human Neurobiology
      organization: Boston University School of Medicine
      start_date: 2022
      end_date: 2023
      highlights:
        - Used wearable technology and behavioral coding to measure behavior in children with atopic dermatitis.
        - Led outreach to local healthcare facilities to recruit study participants.
    - position: Research Technician (part-time)
      organization: Symmetry Science Consulting
      start_date: 2022
      end_date: 2023
      highlights:
        - Processed wearable device data (Apple Watch, actigraphy) and participant-reported sleep and skin quality surveys.
    - position: Clinical Research Coordinator
      organization: Shriners Hospitals for Children, Philadelphia, PA
      start_date: 2021
      end_date: 2022
      highlights:
        - Managed industry-funded clinical trials on adolescent orthopedic conditions and spinal cord injury.
        - Prepared IRB submissions for FDA-regulated studies and contributed to grant writing.
    - position: Research Assistant, Virtual Environment and Postural Orientation (VEPO) Lab
      organization: Temple University
      start_date: 2018
      end_date: 2018
      highlights:
        - Supported EEG data collection and analysis and processed motion capture data for research on postural orientation.
    - position: Research Assistant, Temple Research Immersive Balance and Locomotion (TRIBAL) Lab
      organization: Temple University
      start_date: 2016
      end_date: 2017
      highlights:
        - Set up motion capture (Vicon) markers and cameras and performed preliminary analysis of movement data.
        - Supported participant-facing study procedures, including explaining experimental protocols.

