  location: Boston, MA

  interests: >-
    Sensorimotor development and integration in infants and children with or at risk for cerebral palsy; development
    of bimanual skills and their cortical correlates; corticospinal connectivity and online motor control, using fNIRS,
    TMS and behavioral coding.

